name: Validate AdiXtream migration

on:
  pull_request:
    branches: [master]
  push:
    branches: [migration/cloudstream-2026-09-compose-premium]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Clean build, tests and lint without production secrets
        run: ./gradlew clean :app:assembleStableDebug :app:testStableDebugUnitTest :library:jvmTest :app:lintStableDebug --no-configuration-cache --stacktrace
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-reports
          path: |
            app/build/reports/
            library/build/reports/
          retention-days: 14
      - name: Upload isolated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdiXtream-migration-debug
          path: app/build/outputs/apk/stable/debug/*.apk
          retention-days: 14
