name: Build Release (FINAL FIX)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      # Owner-approved signed candidate validation; artifact only, never a release.
      - migration/cloudstream-2026-09-compose-premium

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Siapkan Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Decode Keystore dari Secret
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "SIGNING_KEY is required"; exit 1; }
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 -d > app/release.keystore

      - name: Izinkan Gradle
        run: chmod +x gradlew

      - name: Mulai Proses Build
        run: |
          if [ "$GITHUB_REF_NAME" = "migration/cloudstream-2026-09-compose-premium" ]; then
            ./gradlew :app:assembleStableRelease --no-configuration-cache
          else
            ./gradlew assembleRelease --no-configuration-cache
          fi
        env:
          KEYSTORE_PATH: release.keystore
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          # === TAMBAHAN ADIXTREAM: SECURITY REPO PROTECTOR (LEVEL 2 - XOR) ===
          # Menyuntikkan Kunci Rahasia dan Base64 ke dalam sistem Gradle
          XOR_SECRET_KEY: ${{ secrets.XOR_SECRET_KEY }}
          PREMIUM_REPO_ENCODED: ${{ secrets.PREMIUM_REPO_ENCODED }}
          FREE_REPO_ENCODED: ${{ secrets.FREE_REPO_ENCODED }}
          FIREBASE_URL_ENCODED: ${{ secrets.FIREBASE_URL_ENCODED }}
          # ===================================================================

      - name: Verify release APK identity and signature
        run: |
          python3 - <<'PYVERIFY'
          import os, subprocess
          from pathlib import Path
          build_tools = Path(os.environ['ANDROID_HOME']) / 'build-tools' / '36.0.0'
          apks = list(Path('app/build/outputs/apk').glob('**/*release*.apk'))
          assert apks, 'No release APK generated'
          for apk in apks:
              subprocess.run([str(build_tools / 'apksigner'), 'verify', str(apk)], check=True)
              metadata = subprocess.check_output([str(build_tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
              assert "package: name='com.adixtream.app'" in metadata, 'Unexpected application ID'
              assert 'application-debuggable' not in metadata, 'Debuggable APK must not be delivered'
          print(f'PASS: {len(apks)} signed, non-debuggable release APK(s); package com.adixtream.app')
          PYVERIFY

      - name: Upload APK ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'migration/cloudstream-2026-09-compose-premium' && 'AdiXtream-signed-candidate' || 'AdiXtream-Release' }}
          # Mencari semua file apk di dalam folder output (termasuk folder stable)
          path: app/build/outputs/apk/**/*.apk

      - name: Bersihkan file keystore sementara
        if: always()
        run: rm -f app/release.keystore
