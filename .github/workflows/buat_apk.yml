name: Build Release (FINAL FIX)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Siapkan Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore dari Secret
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/release.keystore

      - name: Izinkan Gradle
        run: chmod +x gradlew

      - name: Mulai Proses Build
        id: signed_build
        run: ./gradlew -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false clean :app:assembleStableRelease :app:testStableReleaseUnitTest
        env:
          KEYSTORE_PATH: release.keystore
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # === TAMBAHAN ADIXTREAM: SECURITY REPO PROTECTOR (LEVEL 2 - XOR) ===
          # Menyuntikkan Kunci Rahasia dan Base64 ke dalam sistem Gradle
          XOR_SECRET_KEY: ${{ secrets.XOR_SECRET_KEY }}
          PREMIUM_REPO_ENCODED: ${{ secrets.PREMIUM_REPO_ENCODED }}
          FREE_REPO_ENCODED: ${{ secrets.FREE_REPO_ENCODED }}
          FIREBASE_URL_ENCODED: ${{ secrets.FIREBASE_URL_ENCODED }}
          # ===================================================================

      - name: Verify Signed Stable APK
        shell: bash
        run: |
          set -euo pipefail
          apk_count=0
          verifier="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          badging="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$verifier"
          test -n "$badging"
          previous_apk="$RUNNER_TEMP/AdiXtream-4.8.4.apk"
          curl --fail --location --retry 3 --output "$previous_apk" \
            https://github.com/michat88/AdiXtream/releases/download/v4.8.4/AdiXtream-4.8.4.apk
          previous_signers="$("$verifier" verify --print-certs "$previous_apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
          previous_package="$("$badging" dump badging "$previous_apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          previous_code="$("$badging" dump badging "$previous_apk" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          test -n "$previous_signers"
          if test "$previous_package" != com.adixtream.app; then
            echo "Previous production APK package identity does not match the preserved applicationId."
            exit 1
          fi
          compatibility_failed=0
          while IFS= read -r -d '' apk; do
            "$verifier" verify "$apk"
            current_signers="$("$verifier" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
            current_package="$("$badging" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            current_code="$("$badging" dump badging "$apk" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
            if test "$current_signers" = "$previous_signers"; then
              echo "Existing-user signing certificate compatibility: PASS"
            else
              echo "Existing-user signing certificate compatibility: FAIL"
              compatibility_failed=1
            fi
            if test "$current_package" = "$previous_package"; then
              echo "Existing-user package identity compatibility: PASS"
            else
              echo "Existing-user package identity compatibility: FAIL"
              compatibility_failed=1
            fi
            if test "$current_code" -gt "$previous_code"; then
              echo "Existing-user versionCode ordering: PASS"
            else
              echo "Existing-user versionCode ordering: FAIL"
              compatibility_failed=1
            fi
            apk_count=$((apk_count + 1))
          done < <(find app/build/outputs/apk/stable/release -name '*.apk' -type f -print0)
          test "$apk_count" -gt 0
          test "$compatibility_failed" -eq 0

      - name: Upload APK ke GitHub
        if: ${{ !cancelled() && steps.signed_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: AdiXtream-Release
          if-no-files-found: error
          # Mencari semua file apk di dalam folder output (termasuk folder stable)
          path: app/build/outputs/apk/stable/release/*.apk

      - name: Validate Release Lint
        if: ${{ !cancelled() && steps.signed_build.outcome == 'success' }}
        run: ./gradlew -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false :app:lintStableRelease

      - name: Summarize Validation Results
        if: always()
        shell: python
        run: |
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testStableReleaseUnitTest/TEST-*.xml'):
              suite = ET.parse(path).getroot()
              print('TEST SUITE', suite.get('name'), 'tests=' + suite.get('tests', '?'),
                    'failures=' + suite.get('failures', '?'), 'errors=' + suite.get('errors', '?'))
          for path in glob.glob('app/build/reports/lint-results-stableRelease.xml'):
              for issue in ET.parse(path).getroot().findall('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      location = issue.find('location')
                      print('LINT ERROR', issue.get('id'), location.get('file'),
                            'line=' + location.get('line', '?'), issue.get('message'))

      - name: Upload Validation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdiXtream-Validation
          if-no-files-found: error
          path: |
            app/build/reports/tests/testStableReleaseUnitTest/
            app/build/test-results/testStableReleaseUnitTest/
            app/build/reports/lint-results-stableRelease.*
