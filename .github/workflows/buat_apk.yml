name: Build Release (FINAL FIX)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Siapkan Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify locked Premium feature flags
        shell: python
        run: |
          import re, pathlib
          assert re.search(r'const val ENABLED\s*=\s*false', pathlib.Path('app/src/main/java/com/lagradost/cloudstream3/CentralPremiumApi.kt').read_text())
          assert re.search(r'PRODUCTION_FIREBASE_ENABLED\s*=\s*false', pathlib.Path('server/premium-api/src/service.mjs').read_text())

      - name: Decode Keystore dari Secret
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/release.keystore

      - name: Izinkan Gradle
        run: chmod +x gradlew

      - name: Mulai Proses Build
        id: signed_build
        run: ./gradlew -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false clean :app:assembleStableRelease :app:testStableReleaseUnitTest
        env:
          KEYSTORE_PATH: release.keystore
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # === TAMBAHAN ADIXTREAM: SECURITY REPO PROTECTOR (LEVEL 2 - XOR) ===
          # Menyuntikkan Kunci Rahasia dan Base64 ke dalam sistem Gradle
          XOR_SECRET_KEY: ${{ secrets.XOR_SECRET_KEY }}
          PREMIUM_REPO_ENCODED: ${{ secrets.PREMIUM_REPO_ENCODED }}
          FREE_REPO_ENCODED: ${{ secrets.FREE_REPO_ENCODED }}
          FIREBASE_URL_ENCODED: ${{ secrets.FIREBASE_URL_ENCODED }}
          # ===================================================================

      - name: Verify Signed Stable APK
        shell: bash
        run: |
          set -euo pipefail
          apk_count=0
          verifier="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          badging="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$verifier"
          test -n "$badging"
          previous_apk="$RUNNER_TEMP/AdiXtream-4.8.4.apk"
          curl --fail --location --retry 3 --output "$previous_apk" \
            https://github.com/michat88/AdiXtream/releases/download/v4.8.4/AdiXtream-4.8.4.apk
          previous_signers="$("$verifier" verify --print-certs "$previous_apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
          previous_package="$("$badging" dump badging "$previous_apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          previous_code="$("$badging" dump badging "$previous_apk" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          test -n "$previous_signers"
          if test "$previous_package" != com.adixtream.app; then
            echo "Previous production APK package identity does not match the preserved applicationId."
            exit 1
          fi
          compatibility_failed=0
          while IFS= read -r -d '' apk; do
            "$verifier" verify "$apk"
            current_signers="$("$verifier" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
            current_package="$("$badging" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            current_code="$("$badging" dump badging "$apk" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
            if test "$current_signers" = "$previous_signers"; then
              echo "Existing-user signing certificate compatibility: PASS"
            else
              echo "Existing-user signing certificate compatibility: FAIL"
              compatibility_failed=1
            fi
            if test "$current_package" = "$previous_package"; then
              echo "Existing-user package identity compatibility: PASS"
            else
              echo "Existing-user package identity compatibility: FAIL"
              compatibility_failed=1
            fi
            if test "$current_code" -gt "$previous_code"; then
              echo "Existing-user versionCode ordering: PASS"
            else
              echo "Existing-user versionCode ordering: FAIL"
              compatibility_failed=1
            fi
            apk_count=$((apk_count + 1))
          done < <(find app/build/outputs/apk/stable/release -name '*.apk' -type f -print0)
          test "$apk_count" -gt 0
          test "$compatibility_failed" -eq 0

      - name: Collect internal signed APK metadata
        shell: python
        run: |
          APK_GLOB='app/build/outputs/apk/stable/release/*.apk'
          APK_NAME='AdiXtream-4.8.7-internal-test'
          EXPECTED_PACKAGE='com.adixtream.app'
          EXPECTED_CODE=94
          EXPECTED_VERSION='4.8.7'
          EXPECTED_CERT=None
          VARIANT='stableRelease'
          SIGNING_REFERENCE='Existing signed production v4.8.4 APK, verified by previous workflow step'
          GOOGLE_NATIVE=False
          import glob, hashlib, json, os, pathlib, re, shutil, subprocess
          root = pathlib.Path('.')
          sdk = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools'
          def tool(name):
              paths = list(sdk.glob('*/' + name))
              assert paths, 'Android verification tool missing: ' + name
              return sorted(paths, key=lambda p: tuple(int(n) for n in re.findall(r'\d+', p.parent.name)))[-1]
          aapt, signer = tool('aapt'), tool('apksigner')
          out = root / 'internal-apks'
          out.mkdir(exist_ok=True)
          assert not list(out.glob('*.apk')), 'Output directory must be clean'
          apks = sorted(root.glob(APK_GLOB))
          assert apks, 'Release APK missing'
          for index, apk in enumerate(apks):
              signature = subprocess.check_output([str(signer), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
              certs = sorted(set(x.replace(':','').lower() for x in re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F:]+)', signature)))
              assert certs and all(len(x) == 64 for x in certs), 'Signing certificate unavailable'
              badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
              package = re.search(r"^package: name='([^']+)'", badging, re.M).group(1)
              version_code = int(re.search(r"^package:.*versionCode='(\d+)'", badging, re.M).group(1))
              version_name = re.search(r"^package:.*versionName='([^']+)'", badging, re.M).group(1)
              assert package == EXPECTED_PACKAGE and version_code == EXPECTED_CODE and version_name == EXPECTED_VERSION, 'Manifest identity/version changed'
              assert 'application-debuggable' not in badging, 'Debuggable APK is not allowed'
              if EXPECTED_CERT:
                  assert certs == [EXPECTED_CERT], 'Production certificate mismatch'
              suffix = '' if len(apks) == 1 else '-' + str(index + 1)
              target = out / (APK_NAME + suffix + '.apk')
              shutil.copyfile(apk, target)
              metadata = dict(file=target.name, repository=os.environ['GITHUB_REPOSITORY'], branch=os.environ['GITHUB_REF_NAME'],
                  sourceCommit=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                  versionName=version_name, versionCode=version_code, packageName=package, variant=VARIANT,
                  sizeBytes=target.stat().st_size, sha256=hashlib.sha256(target.read_bytes()).hexdigest(),
                  certificateSha256=certs, signed=True, debuggable=False, backendProductionLocked=True,
                  signingCompatibilityReference=SIGNING_REFERENCE,
                  runUrl=os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'])
              if GOOGLE_NATIVE:
                  lists = list(root.glob('android/app/build/generated/autolinking/**/PackageList.java'))
                  assert any('googlesignin' in p.read_text().lower() for p in lists), 'Native Google Sign-In package not linked'
                  metadata['googleSignInNativeLinked'] = True
              target.with_suffix('.metadata.json').write_text(json.dumps(metadata, indent=2)+'\n')
              target.with_suffix('.sha256').write_text(metadata['sha256']+'  '+target.name+'\n')
              print(json.dumps(metadata))
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as report:
                  report.write('\nInternal signed release: '+target.name+'\nCommit: '+metadata['sourceCommit']+'\nSHA-256: '+metadata['sha256']+'\n')

      - name: Upload APK ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: AdiXtream-4.8.7-Internal-Test
          if-no-files-found: error
          # Mencari semua file apk di dalam folder output (termasuk folder stable)
          path: internal-apks/
          retention-days: 7

      - name: Validate Release Lint
        if: ${{ !cancelled() && steps.signed_build.outcome == 'success' }}
        run: ./gradlew -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false :app:lintStableRelease

      - name: Summarize Validation Results
        if: always()
        shell: python
        run: |
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testStableReleaseUnitTest/TEST-*.xml'):
              suite = ET.parse(path).getroot()
              print('TEST SUITE', suite.get('name'), 'tests=' + suite.get('tests', '?'),
                    'failures=' + suite.get('failures', '?'), 'errors=' + suite.get('errors', '?'))
          for path in glob.glob('app/build/reports/lint-results-stableRelease.xml'):
              for issue in ET.parse(path).getroot().findall('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      location = issue.find('location')
                      print('LINT ERROR', issue.get('id'), location.get('file'),
                            'line=' + location.get('line', '?'), issue.get('message'))

      - name: Upload Validation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdiXtream-Validation
          if-no-files-found: error
          path: |
            app/build/reports/tests/testStableReleaseUnitTest/
            app/build/test-results/testStableReleaseUnitTest/
            app/build/reports/lint-results-stableRelease.*

      - name: Remove temporary signing material
        if: always()
        run: rm -f app/release.keystore
